<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M3 编辑器岛</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#111827;background:#eef1f6;overflow:hidden}
  #root{height:100%;display:flex;flex-direction:column}
  .bar{flex:0 0 40px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#fff;border-bottom:1px solid #e5e7eb;font-size:12px}
  .bar strong{font-size:13px}
  .chip{padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}
  .chip.warn{background:#fef3c7;color:#92400e}
  .spacer{flex:1}
  button{font:inherit;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  #stage{flex:1;position:relative;overflow:auto;padding:16px;display:flex;align-items:flex-start;justify-content:center}
  #canvasWrap{position:relative;flex:0 0 auto}
  #canvas{position:absolute;top:0;left:0;background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.12);border-radius:16px;overflow:hidden}
  .m3-item{cursor:grab;user-select:none;touch-action:none}
  .m3-item:active{cursor:grabbing}
  .m3-item[data-anchor]{cursor:grab}
  .sel{outline:2px solid #2563eb;outline-offset:-1px}
  #hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:#6b7280}
</style>
</head>
<body>
<div id="root">
  <div class="bar">
    <strong id="title">编辑器岛</strong>
    <span class="chip" id="ver">—</span>
    <span class="chip" id="state">loading</span>
    <span class="spacer"></span>
    <button id="btnUndo" disabled>撤销</button>
    <button id="btnRedo" disabled>重做</button>
    <button id="btnSave" disabled class="primary">保存</button>
  </div>
  <div id="stage"><div id="canvasWrap"><div id="canvas"></div></div><div id="hint"></div></div>
</div>
<script type="module" src="./island.js"></script>
</body>
</html>
